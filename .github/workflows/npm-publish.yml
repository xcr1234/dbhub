# Manual publish workflow for @xcr1234/dbhub-fork
#
# Trigger: only manual via workflow_dispatch.
# Auth:    OIDC trusted publishing (no NPM_TOKEN needed).
#          Configure trusted publisher at https://www.npmjs.com/package/@xcr1234/dbhub-fork/access
#            - Repository: xcr1234/dbhub
#            - Workflow filename: npm-publish.yml
#            - Environment: (leave empty)
#
# Usage:
#   1. Bump `version` in ./package.json on a branch and merge to main.
#   2. GitHub → "Publish to npm" → Run workflow.
#      - version: leave blank to use the value from package.json, or override (e.g. 1.11.0-beta.1).
#      - tag:     default `latest`. Use `beta` / `next` for prerelease.

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (blank = use ./package.json version)"
        required: false
        default: ""
      tag:
        description: "npm dist-tag (latest, beta, next, ...)"
        required: false
        default: ""

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Resolve version, tag, and prepare package.json
        run: |
          set -euo pipefail

          PKG_JSON="./package.json"

          # 1. Decide which version to publish
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Manual override version: ${VERSION}"
          else
            VERSION=$(jq -r '.version' "$PKG_JSON")
            echo "Using version from package.json: ${VERSION}"
          fi

          # 2. Decide the npm dist-tag
          #    Priority: explicit input > infer from version string > default `latest`.
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            echo "Using explicit tag from input: ${TAG}"
          elif [[ "${VERSION}" == *"-"* ]]; then
            TAG=$(echo "${VERSION}" | cut -d'-' -f2 | cut -d'.' -f1)
            echo "Prerelease detected — derived tag: ${TAG}"
          else
            TAG="latest"
            echo "Stable version — using tag: latest"
          fi

          # 3. Rewrite the manifest so the tarball ships only what's needed.
          #    Do this AFTER reading the version so we don't lose the source value.
          jq --arg version "$VERSION" '
            .version = $version
            | .files  = ["dist/**/*", "LICENSE", "README.md"]
            | .bin    = {"dbhub": "dist/index.js"}
          ' "$PKG_JSON" > "$PKG_JSON.tmp"
          mv "$PKG_JSON.tmp" "$PKG_JSON"

          # 4. Export for the publish step
          {
            echo "PACKAGE_VERSION=${VERSION}"
            echo "NPM_TAG=${TAG}"
          } >> "$GITHUB_ENV"

          echo "Will publish @xcr1234/dbhub-fork@${VERSION} with tag ${TAG}"

      - name: Publish to npm
        run: |
          echo "Publishing @xcr1234/dbhub-fork@${PACKAGE_VERSION} (tag: ${NPM_TAG})"
          pnpm config set registry https://registry.npmjs.org
          # --provenance  : generate npm provenance attestation via OIDC
          # --no-git-checks : monorepo builds emit untracked dist/ files; skip the dirty-git guard
          pnpm publish --provenance --tag "${NPM_TAG}" --no-git-checks --access public
          echo "Published."